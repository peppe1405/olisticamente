<style>
:root{
  --paper:#F6F6EE; --surface:#FFFFFD; --band:#FBF2B9; --ink:#262B1C; --ink-2:#5A614D; --line:#E3E3D3;
  --olive:#5B6A39; --olive-ink:#FFFFFF; --err:#A23E49;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#13160F; --surface:#1C2016; --band:#1E2217; --ink:#ECEDDF; --ink-2:#B0B6A0; --line:#2F3528;
    --olive:#B5C48B; --olive-ink:#1A1F10; --err:#EC959D; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--band);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding-block:32px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.logo{width:112px;height:112px;display:block}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1.15;color:var(--olive);text-align:center}
.sub{margin:6px 0 0;color:var(--ink-2);font-size:.92rem;text-align:center}
form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
label.l{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
input[type=password],input[type=text]{width:100%;height:52px;padding:0 16px;border-radius:16px;font:inherit;font-size:17px;color:var(--ink);
  background:var(--surface);border:1.5px solid color-mix(in srgb, var(--olive) 30%, transparent);outline:none}
input:focus{border-color:var(--olive);box-shadow:0 0 0 4px color-mix(in srgb, var(--olive) 16%, transparent)}
.row{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--ink-2)}
.row input{width:20px;height:20px;accent-color:var(--olive)}
button{height:52px;border:0;border-radius:16px;background:var(--olive);color:var(--olive-ink);font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
button[disabled]{opacity:.6}
.msg{min-height:1.4em;margin:0;font-size:.9rem;color:var(--err);text-align:center}
.foot{max-width:360px;margin:0;font-size:.78rem;color:var(--ink-2);text-align:center}
noscript p{max-width:360px;text-align:center}
</style>
</head>

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var code = document.getElementById("code").value.trim();
    if (!code) return;
    var btn = document.getElementById("go");
    btn.disabled = true; btn.textContent = "Apro…"; msg.textContent = "";
    var keyRef;
    derive(code).then(function (key) { keyRef = key; return decryptWith(key); }).then(function (html) {
      if (document.getElementById("remember").checked) {
        return subtle.exportKey("raw", keyRef).then(function (raw) { try { localStorage.setItem(KEY, tob64(raw)); } catch (e) {} return html; });
      }
      return html;
    }).then(show).catch(function () {
      btn.disabled = false; btn.textContent = "Entra";
      msg.textContent = "Codice non corretto. Controlla maiuscole e spazi e riprova.";
      document.getElementById("code").select();
    });
  });
})();
</script>
